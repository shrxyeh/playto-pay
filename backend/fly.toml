# fly.toml - Fly.io configuration for playto backend
app = "playto-backend"
primary_region = "iad"

[build]

[env]
  DJANGO_SETTINGS_MODULE = "config.settings"
  PORT = "8080"

[processes]
  web = "sh -c 'python manage.py migrate && python manage.py seed && python manage.py collectstatic --noinput && gunicorn wsgi:application --bind 0.0.0.0:8080 --workers 2'"
  worker = "sh -c 'C_FORCE_ROOT=1 celery -A config worker -l info'"
  beat = "sh -c 'C_FORCE_ROOT=1 celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler'"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["web"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["web"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["beat"]
